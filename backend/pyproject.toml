[project]
name = "govpath-backend"
version = "0.1.0"
description = "GovPath AI backend: verified government-service knowledge, deterministic workflow planning, and RAG explanations."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn[standard]>=0.54",
    "pydantic-settings>=2.16",
    "python-multipart>=0.0.33",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "psycopg[binary]>=3.3,<4",
    "alembic>=1.20",
    "pgvector>=0.5",
    "google-genai>=3.3,<4",
    "httpx>=0.28",
    "beautifulsoup4>=4.15",
    "pymupdf>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.5",
    "aiosqlite>=0.22",
    "ruff>=0.17",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Report tables and prompt strings in the offline evaluation harness.
"evaluation/*" = ["E501"]
